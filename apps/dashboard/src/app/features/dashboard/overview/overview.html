<div class="min-h-screen bg-gray-50 p-6">
  <!-- Navbar -->
  <div class="bg-white shadow-sm border border-gray-200 rounded-lg mb-8 p-4">
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-900">Cognitive PlayKit</h1>
      <div class="flex items-center gap-4">
        <button
          class="px-3 py-2 text-sm bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors"
          (click)="onRefresh()"
          [disabled]="isLoading"
        >
          <span *ngIf="isLoading">⏳</span>
          <span *ngIf="!isLoading">🔄</span>
          Actualizar
        </button>
        <span class="text-sm text-gray-500">{{ formattedLastUpdated }}</span>
        <button
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
          (click)="logout()"
        >
          Cerrar Sesión
        </button>
      </div>
    </div>
  </div>

  <!-- Alert con datos reales -->
  <div
    class="bg-green-50 border border-green-200 rounded-lg p-4 mb-8"
    *ngIf="dashboardData && !isLoading"
  >
    <div class="flex items-center gap-2">
      <span class="text-green-600">✅</span>
      <span class="text-green-800 font-medium">
        ¡Hola {{ currentUser.name || 'Usuario Demo' }}! Dashboard con datos reales de API -
        {{ dashboardData.stats.totalSessions }} sesiones totales
      </span>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center min-h-96">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
      <p class="mt-4 text-gray-600">Cargando datos del dashboard...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="bg-red-50 border border-red-200 rounded-lg p-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-red-600">❌</span>
        <span class="text-red-800">{{ error }}</span>
      </div>
      <button
        class="px-3 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 transition-colors"
        (click)="onRefresh()"
      >
        Reintentar
      </button>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div class="max-w-7xl mx-auto space-y-8" *ngIf="dashboardData && !isLoading">
    <!-- Stats Cards -->
    <app-stats-cards [data]="dashboardData.stats"></app-stats-cards>

    <!-- Main Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <app-bar-chart-gradient></app-bar-chart-gradient>
      <app-line-chart-pulse></app-line-chart-pulse>
      <app-donut-chart [data]="dashboardData.devices"></app-donut-chart>
    </div>

    <!-- Quick Actions -->
    <app-quick-actions></app-quick-actions>
  </div>
</div>
