nelmio_cors:
  defaults:
    origin_regex: true
    allow_origin: ["http://localhost:4200", "http://127.0.0.1:4200"]
    allow_headers: ["Content-Type", "Authorization", "X-Requested-With"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    expose_headers: ["Link"]
    max_age: 3600
  paths:
    "^/api/":
      allow_origin: ["*"]
      allow_headers: ["Content-Type", "Authorization", "X-Requested-With"]
      allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      max_age: 3600
